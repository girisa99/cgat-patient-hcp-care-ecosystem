name: CI

on:
  push:
    branches: [dev, test, uat, main]
  pull_request:
    branches: [dev, test, uat, main]
  workflow_dispatch: {}

jobs:
  build:
    # For push events, map branch to GitHub Environment for scoped secrets.
    # For pull_request events, use the PR *target* branch (base_ref) so secrets
    # resolve correctly. workflow_dispatch falls back to ref_name.
    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    runs-on: ubuntu-latest
    # Expose secrets as env vars so step-level `if` can check them via env context
    env:
      HAS_E2E_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE != '' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type-check (strict)
        run: |
          npx tsc -p tsconfig.strict-check.json --noEmit
          npx tsc -p tsconfig.strict-check.app.json --noEmit
          npx tsc -p tsconfig.strict-check.node.json --noEmit

      - name: Build project
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Install Playwright browsers
        if: env.HAS_E2E_SECRETS == 'true'
        run: npx playwright install --with-deps

      - name: Start preview server
        if: env.HAS_E2E_SECRETS == 'true'
        run: |
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173

      - name: Run Playwright smoke test (auth only)
        if: env.HAS_E2E_SECRETS == 'true'
        run: npx playwright test -g "01 Authentication"

      - name: Generate Playwright storage state
        if: env.HAS_E2E_SECRETS == 'true'
        run: node tests/create-storage-state.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Run full Playwright E2E (02–05)
        if: env.HAS_E2E_SECRETS == 'true'
        run: npx playwright test -g "02|03|04|05" --storage-state=tests/storageState.json
