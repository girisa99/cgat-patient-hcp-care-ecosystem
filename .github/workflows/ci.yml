name: CI

on:
  push:
    branches: [dev, test, uat, main]
  pull_request:
    branches: [dev, test, uat, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type-check (strict)
        run: |
          npx tsc -p tsconfig.strict-check.json --noEmit
          npx tsc -p tsconfig.strict-check.app.json --noEmit
          npx tsc -p tsconfig.strict-check.node.json --noEmit

      - name: Build project
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # Only run E2E when secrets are available (configured in GitHub Environment)
    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    # Skip this entire job gracefully if the environment doesn't exist
    continue-on-error: true
    env:
      HAS_E2E_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE != '' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != '' }}
    steps:
      - name: Check for E2E secrets
        id: check
        run: |
          if [ "$HAS_E2E_SECRETS" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ E2E secrets not configured — skipping E2E tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ E2E secrets found — running E2E tests"
          fi

      - name: Checkout repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build project
        if: steps.check.outputs.skip != 'true'
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Install Playwright browsers
        if: steps.check.outputs.skip != 'true'
        run: npx playwright install --with-deps

      - name: Start preview server
        if: steps.check.outputs.skip != 'true'
        run: |
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173

      - name: Run Playwright smoke test (auth only)
        if: steps.check.outputs.skip != 'true'
        run: npx playwright test -g "01 Authentication"

      - name: Generate Playwright storage state
        if: steps.check.outputs.skip != 'true'
        run: node tests/create-storage-state.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Run full Playwright E2E (02–05)
        if: steps.check.outputs.skip != 'true'
        run: npx playwright test -g "02|03|04|05" --storage-state=tests/storageState.json
