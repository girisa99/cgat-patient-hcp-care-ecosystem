name: CI

on:
  push:
    branches: [dev, test, uat, main]
  pull_request:
    branches: [dev, test, uat, main]
  workflow_dispatch: {}

jobs:
  build:
    # Map branch names to GitHub Environments so that secrets are scoped correctly
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type-check (strict)
        run: |
          npx tsc -p tsconfig.strict-check.json --noEmit
          npx tsc -p tsconfig.strict-check.app.json --noEmit
          npx tsc -p tsconfig.strict-check.node.json --noEmit

      - name: Build project
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start preview server
        run: |
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173

      - name: Run Playwright smoke test (auth only)
        run: npx playwright test -g "01 Authentication"

      - name: Generate Playwright storage state
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE != '' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != '' }}
        run: node tests/create-storage-state.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Run full Playwright E2E (02–05)
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE != '' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != '' }}
        run: npx playwright test -g "02|03|04|05" --storage-state=tests/storageState.json