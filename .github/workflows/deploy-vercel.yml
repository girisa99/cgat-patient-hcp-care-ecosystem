name: Deploy to Vercel

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ── Preview deployment (PRs and dev/uat branches) ──
      - name: Pull Vercel environment (Preview)
        if: github.ref_name != 'main'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Preview)
        if: github.ref_name != 'main'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy (Preview)
        if: github.ref_name != 'main'
        id: preview-deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      # ── Production deployment (main branch only) ──
      - name: Pull Vercel environment (Production)
        if: github.ref_name == 'main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Production)
        if: github.ref_name == 'main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy (Production)
        if: github.ref_name == 'main'
        id: prod-deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Production deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      # ── Comment preview URL on PRs ──
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview-deploy.outputs.deploy_url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview-deploy.outputs.deploy_url }}';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Vercel Preview Deployment\n\nDeployed to: ${url}\n\nThis preview will be available until the PR is closed.`
            });
