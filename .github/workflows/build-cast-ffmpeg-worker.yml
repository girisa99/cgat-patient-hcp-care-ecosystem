name: Build Cast FFmpeg Worker

on:
  push:
    branches: [dev, uat, main]
    paths:
      - 'runpod-workers/cast-ffmpeg-renderer/**'
  workflow_dispatch:  # Manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine tag from branch
        id: tag
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$BRANCH" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH -> Tag: ${{ steps.tag.outputs.tag || 'pending' }}"

      - name: Debug secrets
        run: |
          echo "DOCKERHUB_USERNAME is set: ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "DOCKERHUB_TOKEN is set: ${{ secrets.DOCKERHUB_TOKEN != '' }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod-workers/cast-ffmpeg-renderer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cast-ffmpeg-renderer:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/cast-ffmpeg-renderer:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${GITHUB_REF##*/}\`" >> $GITHUB_STEP_SUMMARY
