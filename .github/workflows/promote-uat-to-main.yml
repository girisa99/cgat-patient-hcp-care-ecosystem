name: Promote UAT to main

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["uat"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    # Optional: create a GitHub Environment named "production" and require approvals there
    environment: production
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR (uat -> main) and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const base = "main";
            const headBranch = "uat";
            const head = `${owner}:${headBranch}`;

            const title = "Promote uat to main";
            const body = [
              "Automated promotion PR created after CI passed on `uat`.",
              "",
              "If UAT testing is complete and approvals are satisfied, merging this PR will promote to `main`."
            ].join("\n");

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head
            });

            let pr;
            if (prs.length > 0) {
              pr = prs[0];
              core.info(`Found existing PR #${pr.number}: ${pr.html_url}`);
            } else {
              core.info(`Creating PR from ${head} -> ${base}`);
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: headBranch,
                base,
                body
              });
              pr = created;
              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            }

            // Try to enable auto-merge (requires repo setting enabled)
            // Note: merge gating can be enforced via branch protections + required checks + environment approvals.
            try {
              const prNode = await github.graphql(
                `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) { id }
                    }
                  }
                `,
                { owner, repo, number: pr.number }
              );

              const pullRequestId = prNode.repository.pullRequest.id;
              await github.graphql(
                `
                  mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                      pullRequest { number }
                    }
                  }
                `,
                { pullRequestId, mergeMethod: "MERGE" }
              );
              core.info(`Enabled auto-merge for PR #${pr.number}`);
            } catch (e) {
              core.warning(`Could not enable auto-merge for PR #${pr.number}: ${e.message}`);
            }
