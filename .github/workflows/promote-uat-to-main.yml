name: Promote UAT to main

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["uat"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR (uat -> main) for manual approval
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const base = "main";
            const headBranch = "uat";
            const head = `${owner}:${headBranch}`;

            const title = "Promote uat to main";
            const body = [
              "Automated promotion PR created after CI passed on `uat`.",
              "",
              "After UAT testing is complete, manually approve and merge this PR to promote to `main`."
            ].join("\n");

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head
            });

            let pr;
            if (prs.length > 0) {
              pr = prs[0];
              core.info(`Found existing PR #${pr.number}: ${pr.html_url}`);
            } else {
              core.info(`Creating PR from ${head} -> ${base}`);
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: headBranch,
                base,
                body
              });
              pr = created;
              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            }
