name: Auto-merge feature branches to dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['lovable/**', 'claude/**']

permissions:
  contents: write

jobs:
  auto-merge:
    # Only run when CI succeeded and not already on dev
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge feature branch into dev
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "🔀 Auto-merging '$BRANCH' into dev..."

          git fetch origin dev "$BRANCH" --prune
          git checkout dev
          git reset --hard origin/dev

          # Attempt fast-forward or normal merge
          if git merge "origin/$BRANCH" --no-edit --ff; then
            echo "✅ Merge successful"
            git push origin dev
            echo "✅ Pushed to dev — Vercel deployment will trigger automatically"
          else
            echo "❌ Merge conflict detected — skipping auto-merge"
            echo "Manual merge required for branch: $BRANCH"
            git merge --abort
            exit 1
          fi
